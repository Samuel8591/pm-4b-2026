name: Issues Report
description: Melde ein Problem
body:



- type: input
    id: contact
      label: Contact Details
      description: Was ist ihr Problem?
      placeholder: Hilfe
      required: false


- type: dropdown
    id: version
      label: Version
      description: Hast du gut geschlafen
      options:
        - Ja
        - Nein
      default: 0
    validations:
      required: true